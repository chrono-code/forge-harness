name: publish

# npm Trusted Publishing (OIDC) — 태그 v<version> 푸시 → 사람 토큰·OTP 없이 provenance 발행.
# 🟥 왜 이 형태인가 (2026-09-03): 사람 계정 토큰 발행은 매번 OTP 웹 인증을 요구했고(2.15.0·2.15.1 둘 다),
#    «2FA 우회 토큰» 은 npm 이 제한 예고한 데다 머신에 영구 비밀을 남긴다. OIDC 는 둘 다 없다.
#    npmjs 쪽 1회 등록(패키지 Settings → Trusted publisher → GitHub Actions: chrono-meta / forge-harness /
#    publish.yml / environment 비움)이 선행조건 — 등록 전엔 이 워크플로가 E404/ENEEDAUTH 로 실패한다.
#    prepublishOnly 6단 게이트(신선도·락스텝·커버리지·매니페스트·공개표면)는 그대로 돈다.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write   # OIDC — 이것이 토큰을 대체한다

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm ≥ 11.5 (Trusted Publishing 지원)
        run: npm install -g npm@latest && npm --version
      - name: tag == package.json version (락스텝의 바깥 고리)
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "🟥 tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - name: tag commit == origin/main HEAD (freshness 게이트가 요구하는 «main 의 트리»)
        # 🟥 태그 체크아웃은 detached 라 publish_freshness_check 가 «HEAD 가 main 이 아니다»로 막는다.
        #    태그가 main 끝을 가리킬 때만 발행한다 — 우리 흐름(머지 직후 태그)에선 항상 참이고,
        #    옛 커밋에 태그를 달아 «과거 트리를 발행» 하는 경로는 여기서 죽는다(의도).
        run: |
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "🟥 tag is not at origin/main HEAD — refusing"; exit 1; }
          git checkout -q -B main origin/main
      - name: operator-literal patterns → file (기밀 스캔의 «완전한 계기»)
        # 🟥 v3.0.0 3차 시도(2026-09-04 run 33851451594): prepublishOnly 의 public_surface_scan_files.sh 가
        #    «operator-literal override 부재(HIGH 회사·컴패니언 리터럴 미스캔)» 로 fail-closed. 그 파일은
        #    gitignored 라 체크아웃에 없다 — 이 워크플로가 그 사실을 몰랐다(설계 공백). 시크릿은 base64
        #    한 줄이고, 파일로 풀어 PSA_PATTERNS 로 넘긴다. 비어 있으면 여기서 죽는다(fail-closed) —
        #    PUBLIC_SURFACE_OK 로 우회하지 않는다. 내용은 절대 echo 하지 않는다.
        env:
          PSA_PATTERNS_B64: ${{ secrets.PSA_PATTERNS_B64 }}
        run: |
          [ -n "$PSA_PATTERNS_B64" ] || { echo "🟥 PSA_PATTERNS_B64 secret is empty — the confidentiality scan would be incomplete; refusing to publish"; exit 1; }
          umask 077; printf '%s' "$PSA_PATTERNS_B64" | base64 -d > "$RUNNER_TEMP/psa_patterns"
          n=$(grep -cvE '^\s*(#|$)' "$RUNNER_TEMP/psa_patterns" || true)
          [ "$n" -gt 0 ] || { echo "🟥 decoded pattern file has 0 usable rows"; exit 1; }
          echo "PSA_PATTERNS=$RUNNER_TEMP/psa_patterns" >> "$GITHUB_ENV"
          echo "✅ operator-literal patterns loaded ($n rows)"
      - name: publish (prepublishOnly 게이트 경유, provenance)
        run: npm publish --provenance --access public
      - name: verify on registry
        # 🟥 왜 재시도가 필요한가 (2026-09-06, v3.1.0 실측): `npm publish` 가 성공한 직후
        #    이 단계가 곧바로 조회했다가 **E404 «No match found for version 3.1.0»** 로 죽었다.
        #    그런데 같은 시각 패키지는 실제로 올라가 있었다 — 1 분 뒤 로컬에서 조회하니
        #    `latest: 3.1.0` 이었다. 즉 npm 의 읽기 복제본이 아직 전파 전이었고, 이 단계는
        #    **eventually-consistent 한 상태를 대기 없이** 물었다.
        #    발행은 성공인데 워크플로가 빨갛게 남는 것은 가장 나쁜 형태다 — 「발행 실패」와
        #    「전파 지연」이 같은 얼굴이 되고, 그 게이트를 다음부터 아무도 안 읽는다.
        #    ⚠️ 재시도가 «없는 것을 있다»고 만들지는 않는다: 마지막 시도까지 값이 안 맞으면
        #    그대로 실패한다. 늘린 것은 **관측 창**이지 통과 조건이 아니다.
        run: |
          v=$(node -p "require('./package.json').version")
          got=""
          for i in 1 2 3 4 5 6; do
            got=$(npm view @chrono-meta/fh-gate@"$v" version 2>/dev/null || true)
            [ "$got" = "$v" ] && break
            echo "  … attempt $i/6: registry has '${got:-<none>}', want '$v' — waiting 10s (read-replica lag)"
            sleep 10
          done
          [ "$got" = "$v" ] || { echo "🟥 registry still shows '${got:-<none>}' not '$v' after 6 attempts (~60s)"; exit 1; }
          echo "✅ @chrono-meta/fh-gate@$v on registry"
