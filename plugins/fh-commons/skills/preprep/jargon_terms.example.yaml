# jargon_terms.yaml — L5 「조어 렌즈」의 선언 목록.
#
# 🟥 이 레인은 «이 단어가 어렵다»를 판정하지 않는다. 그건 결론이고, 코드로 굳히면 천장이 된다
#    (FH CLAUDE.md §Mechanization Boundary). 이 레인이 재는 것은 **기록의 성질** 하나다 —
#    «선언된 조어가 낭독면 첫 등장에 풀이를 달고 있는가».
#    어느 단어를 조어로 볼지는 사람이 이 파일에 적는다. 기계는 그 선언을 집행만 한다.
#
# 🟥 왜 생겼나 (2026-08-20 실측): preprep v0.1 이 첫 실사용에서 16건을 냈는데 **어휘 지적이
#    0건**이었고, 같은 날 발표 리뷰 2건의 **최대 지적이 어휘**였다("잘 사용하지 않는 용어들이
#    많이 들어가 있어서 어려워 보여요"). 렌즈가 없어서 안 보인 것이지 깨끗했던 게 아니다.
#    ⇒ 「없는 검사는 초록불로 보입니다」 — 이 덱 자신의 문장이 이 하네스에 그대로 적용됐다.
#
# gloss_window: 첫 등장 줄 기준 ±N 줄 안에 gloss 어휘가 있으면 «풀이됨»으로 인정한다.
#   2 인 이유: 낭독 한 문장이 보통 1~2줄이고, 풀이는 같은 문장이나 바로 다음 문장에 온다.
#   ⚠️ 이 값은 측정 없이 고른 것이다(n=1 코퍼스). 오탐이 나오면 그때 재본다.
gloss_window: 2

terms:
  # ── 리뷰어가 직접 지목한 것 (2026-08-20 구두 리뷰) ─────────────────────────
  - id: 탈상관
    literals: ["탈상관"]
    plain: "만든 회사를 섞는 것"
    gloss: ["만든 회사", "제조사"]
    why: "리뷰어 원문 «되게 정말 안 쓰는 단어»"
  - id: 적대
    literals: ["적대검증", "적대 모듈", "적대적"]
    plain: "흠집 내기 검토 / 반박 담당 AI"
    gloss: ["흠집", "반박"]
    why: "리뷰어 지목. 낭독 6회"
  - id: 앵커
    literals: ["앵커"]
    plain: "기계가 확인할 수 있는 근거"
    gloss: ["파일과 줄 번호", "근거"]
    why: "리뷰어 지목"
  - id: 렌즈
    literals: ["렌즈"]
    plain: "관점"
    gloss: ["관점", "각도"]
    why: "리뷰어 지목"
  - id: 벼리다
    literals: ["벼린", "벼려", "벼립니다"]
    plain: "만든 / 다듬은"
    gloss: []
    why: >-
      리뷰어 지목 «갈고닦는다는 의미». 운영자 결정 2026-08-20: 전량 치환.
      🟢 해소됨 — 부제는 「QA가 담금질한 하네스와 품질 게이트」로 확정(10파일 중 8파일 13건 전파,
      STALE 사본과 운영자 발화 이력 인용 2건은 의도적 제외). 이 항목은 이제 **회귀 가드**다:
      「벼린」이 다시 들어오면 발화한다.
      ⚠️ 「담금질」 자체는 이 목록에 없다 — 부제는 **화면**이고 이 레인은 낭독면만 본다.
      낭독에서 은유를 회수하기로 하면 그때 gloss 규칙을 세운다(현재 미결정).
  - id: 저장소밖
    literals: ["저장소 밖"]
    plain: "그 코드가 안 보이는 곳"
    gloss: ["안 보이는 곳"]
    why: "리뷰어가 5장 뒤에 가서야 뜻을 알았다 — 첫 등장에 풀이가 없었다는 뜻"

  # ── 리뷰어가 이름을 못 댔지만 하중이 더 큰 것 (센서스로 발견) ────────────────
  - id: 계열
    literals: ["계열"]
    plain: "만든 회사 / 회사 모델"
    gloss: ["만든 회사", "제조사", "회사 모델"]
    why: >-
      🟥 낭독 19회로 최다인데 리뷰어 지목 0회. 이해가 안 되면 «어렵다»는 감각만 남고
      어느 단어인지는 안 남는다 — 그래서 구두 피드백만으로는 이 계열이 안 잡힌다.
      이 항목이 이 렌즈가 존재하는 이유 자체다.
  - id: 격리
    literals: ["격리"]
    plain: "서로 떼어 놓기"
    gloss: ["떼어 놓", "떼어놓"]
    why: "명사는 통하나 «격리가 깨졌다» 술어가 안 통한다"
  - id: 비가역
    literals: ["비가역"]
    plain: "되돌릴 수 없는"
    gloss: ["되돌릴 수 없"]
    why: "대본이 이미 병용 중이었다 — 통일만 하면 되는 자리"
  - id: 초록
    literals: ["초록"]
    plain: "초록불 / 통과 표시"
    gloss: ["초록불", "통과 표시", "통과"]
    why: "문서 리뷰가 «Abstract 인가?» 로 헤맸다. 화면이 실제 초록이라 어휘는 살리되 첫 등장 풀이 필수"
  - id: 스코프
    literals: ["스코프"]
    plain: "범위"
    gloss: ["범위"]
    why: "조어"
  - id: 유효독립
    literals: ["유효 독립"]
    plain: "실제로 겹치지 않은 정도"
    gloss: ["겹치지 않"]
    why: "수치 용어 — 값만 있고 뜻이 없으면 청중이 못 받는다"

  # ── 유지하되 첫 등장 풀이가 의무인 것 ──────────────────────────────────────
  - id: 게이트
    literals: ["게이트"]
    plain: "(유지) — 첫 등장에 «통과 검문소» 한 번"
    gloss: ["검문소", "막고 서", "통과"]
    why: "낭독 10회. 제목·자산명과 얽혀 전량 치환은 불가 — 대신 첫 등장 풀이를 의무로 건다"
  - id: 하네스
    literals: ["하네스"]
    plain: "(유지) — 첫 등장에 한 줄 풀이"
    gloss: ["장치", "틀", "얹는"]
    why: "리뷰어가 «메타 하네스 자체는 일반적으로 쓰는 것»이라 허용. 단 첫 등장 풀이는 필요"
  - id: 대조군
    literals: ["대조군"]
    plain: "(유지) — 과학 상식어"
    gloss: ["비교", "같이 돌리는"]
    why: "일상어는 아니나 통용된다. 풀이 있으면 통과"

  # 🟥 2026-08-21 — 「하네스」는 **선언하지 않는다.** 이 덱은 하네스를 소개하는 발표가 아니라
  #   방법론을 소개하는 발표이고, 「게이트/방법론 → 그것이 구현된 형태 = 하네스」 순서로
  #   §3 에서 회수한다(정본: CANON_LEDGER §2026-08-21). 여기 선언하면 L5 가 «첫 등장에
  #   풀이 없음»으로 물고, 그 경고를 따르면 **서사가 무너진다** — 실제로 두 번 그렇게 무너졌다.
  #   ⚠️ 이건 «이 낱말은 쉽다»는 판정이 아니다. **어려운 게 맞고, 늦게 푸는 것이 설계**다.
  #   그 구분이 사라지면 다음 세션이 «쉬운 말이니 안 잡힌 거네»로 읽는다.
